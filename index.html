<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marker Life Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e03131'/%3E%3C/svg%3E">
<meta name="description" content="A tiny tracker for whiteboard markers - know which ones are fresh, fading, or dead before class starts.">
<style>
  :root{
    --bg:#f4f1e9;
    --card:#fffdf7;
    --ink:#28241c;
    --muted:#7d7768;
    --line:#e6dfd0;
    --line-strong:#d8cfba;

    --fresh:#22885a;
    --fresh-bg:#e2f3e9;
    --fresh-line:#b7e0c8;
    --fading:#b97a08;
    --fading-bg:#fbf0d7;
    --fading-line:#eed9a4;
    --dead:#cc4444;
    --dead-bg:#fbe6e4;
    --dead-line:#f0bcb6;

    --unknown:#c8c2b4;
    --accent:#3e63dd;
    --radius:14px;
    --shadow:0 1px 2px rgba(40,36,28,.05);
    --shadow-lift:0 4px 14px rgba(40,36,28,.09);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:
      radial-gradient(1100px 500px at 50% -220px, #fdfbf3 0%, var(--bg) 70%);
    color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .app{
    width:min(680px, 100% - 32px);
    margin-inline:auto;
    padding:26px 0 32px;
  }

  /* ---------- Header ---------- */
  header{ margin-bottom:16px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    flex:none;
    width:38px; height:38px;
    display:grid; place-items:center;
    background:linear-gradient(135deg,#2b2a33,#4a4760);
    color:#fdfbf3;
    border-radius:11px;
    box-shadow:var(--shadow);
  }
  h1{ margin:0; font-size:22px; font-weight:800; letter-spacing:-.02em; }
  .tagline{ margin:2px 0 0 48px; color:var(--muted); font-size:13.5px; }

  /* ---------- Summary ---------- */
  .summary{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; min-height:28px; }
  .pill{
    display:inline-flex; align-items:center; gap:7px;
    padding:5px 12px 5px 9px;
    border-radius:999px;
    font-size:13px;
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
  }
  .pill b{ font-weight:750; font-variant-numeric:tabular-nums; }
  .dot{
    flex:none;
    width:11px; height:11px;
    border-radius:50%;
    background:var(--unknown);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);
  }
  .dot-fresh{ background:var(--fresh); }
  .dot-fading{ background:var(--fading); }
  .dot-dead{ background:var(--dead); }

  /* ---------- Add form ---------- */
  form{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
    margin-top:16px;
  }
  .swatch-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .swatch-row .hint{ color:var(--muted); font-size:12.5px; }
  .swatch{
    width:24px; height:24px;
    border-radius:50%;
    border:2px solid rgba(0,0,0,.12);
    cursor:pointer;
    padding:0;
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .swatch:hover{ transform:scale(1.12); }
  .swatch.active{ box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--ink); }

  .field-grid{
    display:grid;
    grid-template-columns:minmax(140px,1fr) auto auto;
    gap:10px;
    align-items:end;
  }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field > span{
    font-size:12px; font-weight:650;
    color:var(--muted);
    text-transform:uppercase; letter-spacing:.05em;
  }
  input[type="text"]{
    font:inherit;
    font-size:14.5px;
    padding:9px 11px;
    border:1.5px solid var(--line-strong);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    width:100%;
  }
  input[type="text"]:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(62,99,221,.15);
  }
  input::placeholder{ color:#b3ac9c; }

  /* segmented condition control */
  .seg{
    display:inline-flex;
    gap:3px;
    background:#efeadd;
    border:none;
    border-radius:999px;
    padding:3px;
    margin:0;
  }
  .seg legend{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip-path:inset(50%); white-space:nowrap;
  }
  .seg-btn{
    font:inherit;
    font-size:13px; font-weight:650;
    padding:6px 13px;
    border:none;
    border-radius:999px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    transition:background .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .seg-btn[aria-pressed="true"]{
    background:#fff;
    color:var(--ink);
    box-shadow:0 1px 3px rgba(40,36,28,.18);
  }
  .seg-btn[data-cond="fresh"][aria-pressed="true"]{ color:var(--fresh); }
  .seg-btn[data-cond="fading"][aria-pressed="true"]{ color:var(--fading); }
  .seg-btn[data-cond="dead"][aria-pressed="true"]{ color:var(--dead); }

  .add-btn{
    font:inherit;
    font-size:14px; font-weight:700;
    padding:9px 18px;
    border:none;
    border-radius:10px;
    background:var(--ink);
    color:#fdfbf3;
    cursor:pointer;
    transition:transform .08s ease, opacity .12s ease;
  }
  .add-btn:hover{ opacity:.88; }
  .add-btn:active{ transform:scale(.97); }

  /* ---------- Marker list ---------- */
  ul#marker-list{
    list-style:none;
    margin:14px 0 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:10px 12px;
    animation:pop .18s ease;
    transition:box-shadow .15s ease;
  }
  .row:hover{ box-shadow:var(--shadow-lift); }
  @keyframes pop{
    from{ opacity:0; transform:translateY(-4px); }
    to{ opacity:1; transform:none; }
  }

  .cap{
    flex:none;
    width:10px;
    align-self:stretch;
    min-height:36px;
    border-radius:6px;
    background:var(--unknown);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
  }

  .main{ flex:1; min-width:0; }
  .topline{ display:flex; align-items:center; gap:8px; min-width:0; }
  .name{
    font-weight:700;
    font-size:15px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .note{
    margin:1px 0 0 19px;
    font-size:13px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* condition chip - click to cycle */
  .chip{
    flex:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font:inherit;
    font-size:13px;
    font-weight:700;
    padding:7px 13px;
    border-radius:999px;
    cursor:pointer;
    border:1.5px solid transparent;
    transition:transform .08s ease, filter .12s ease;
  }
  .chip:hover{ filter:brightness(.96); }
  .chip:active{ transform:scale(.95); }
  .chip-sym{ font-size:11px; line-height:1; }
  .chip-fresh{ background:var(--fresh-bg); color:var(--fresh); border-color:var(--fresh-line); }
  .chip-fading{ background:var(--fading-bg); color:var(--fading); border-color:var(--fading-line); }
  .chip-dead{ background:var(--dead-bg); color:var(--dead); border-color:var(--dead-line); }

  .row.is-dead .name,
  .row.is-dead .note{ opacity:.55; }
  .row.is-dead .cap{ filter:grayscale(.5) brightness(1.06); }

  .del{
    flex:none;
    width:32px; height:32px;
    display:grid; place-items:center;
    padding:0;
    border:none;
    border-radius:9px;
    background:transparent;
    color:#a49d8d;
    cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .del:hover{ background:var(--dead-bg); color:var(--dead); }

  /* ---------- Empty state ---------- */
  .empty{
    margin-top:14px;
    padding:34px 20px;
    text-align:center;
    border:1.5px dashed var(--line-strong);
    border-radius:var(--radius);
    color:var(--muted);
  }
  .empty svg{ color:#c4bcab; margin-bottom:8px; }
  .empty p{ margin:0 0 14px; font-size:14.5px; }
  .empty-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .btn-secondary{
    font:inherit;
    font-size:13.5px; font-weight:650;
    padding:8px 14px;
    border-radius:9px;
    border:1.5px solid var(--line-strong);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .btn-secondary:hover{ border-color:var(--ink); }

  footer{
    margin-top:18px;
    text-align:center;
    color:#a89f8c;
    font-size:12px;
  }

  :is(button,input):focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  @media (max-width:560px){
    .tagline{ margin-left:0; }
    .field-grid{ grid-template-columns:1fr; }
    .seg{ justify-content:flex-start; }
    .note{ white-space:normal; }
    .chip{ padding:6px 10px; font-size:12.5px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<main class="app">

  <header>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15.2 4.8l4 4L8.5 19.5l-4.7.7.7-4.7L15.2 4.8z"/>
          <path d="M13.2 6.8l4 4"/>
        </svg>
      </span>
      <h1>Marker Life Tracker</h1>
    </div>
    <p class="tagline">Know which markers are fresh, fading, or dead &mdash; before class starts.</p>
    <div class="summary" id="summary" aria-live="polite"></div>
  </header>

  <form id="add-form" autocomplete="off">
    <div class="swatch-row" id="swatches">
      <span class="hint">Quick pick:</span>
    </div>
    <div class="field-grid">
      <label class="field">
        <span>Color</span>
        <input type="text" id="color-input" maxlength="32" placeholder="e.g. red, teal, #ff8800" required>
      </label>

      <fieldset class="seg" id="condition-seg">
        <legend>Condition</legend>
        <button type="button" class="seg-btn" data-cond="fresh" aria-pressed="true">Fresh</button>
        <button type="button" class="seg-btn" data-cond="fading" aria-pressed="false">Fading</button>
        <button type="button" class="seg-btn" data-cond="dead" aria-pressed="false">Dead</button>
      </fieldset>

      <button type="submit" class="add-btn">Add marker</button>

      <label class="field" style="grid-column:1 / -1;">
        <span>Note <small style="text-transform:none;font-weight:400;">(optional)</small></span>
        <input type="text" id="note-input" maxlength="90" placeholder="e.g. cap missing, smells weird">
      </label>
    </div>
  </form>

  <ul id="marker-list" hidden></ul>

  <div class="empty" id="empty-state">
    <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15.2 4.8l4 4L8.5 19.5l-4.7.7.7-4.7L15.2 4.8z"/>
      <path d="M13.2 6.8l4 4"/>
    </svg>
    <p>No markers tracked yet.<br>Add your first one above &mdash; or peek at an example set.</p>
    <div class="empty-actions">
      <button type="button" class="btn-secondary" id="focus-add">Add your first marker</button>
      <button type="button" class="btn-secondary" id="load-sample">Load example set</button>
    </div>
  </div>

  <footer>All data stays on this device &middot; saved automatically</footer>

</main>

<script>
(() => {
  'use strict';

  const KEY = 'wb-marker-tracker-v1';
  const CONDITIONS = {
    fresh:  { label: 'Fresh',  sym: '\u25CF' }, /* filled circle */
    fading: { label: 'Fading', sym: '\u25D0' }, /* half circle   */
    dead:   { label: 'Dead',   sym: '\u2715' }  /* cross         */
  };
  const ORDER = Object.keys(CONDITIONS);
  const QUICK_SWATCHES = [
    { name: 'red',   css: '#e03131' },
    { name: 'blue',  css: '#3b5bdb' },
    { name: 'black', css: '#212529' },
    { name: 'green', css: '#2f9e44' }
  ];

  const $ = (sel) => document.querySelector(sel);
  const listEl    = $('#marker-list');
  const emptyEl   = $('#empty-state');
  const summaryEl = $('#summary');
  const form      = $('#add-form');
  const colorIn   = $('#color-input');
  const noteIn    = $('#note-input');
  const swatchRow = $('#swatches');

  let selectedCondition = 'fresh';
  let markers = load();

  /* ---------- persistence ---------- */

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY));
      if (!Array.isArray(data)) return [];
      return data.filter((m) =>
        m && typeof m === 'object' &&
        typeof m.id === 'string' &&
        typeof m.color === 'string' &&
        ORDER.includes(m.condition)
      ).map((m) => ({
        id: m.id,
        color: m.color.slice(0, 32),
        condition: m.condition,
        note: typeof m.note === 'string' ? m.note.slice(0, 90) : ''
      }));
    } catch (err) {
      return []; /* corrupt or missing storage -> start clean */
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(markers));
    } catch (err) {
      /* storage unavailable or full - app keeps working in-memory */
    }
  }

  function uid() {
    return (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'm-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
  }

  /* ---------- helpers ---------- */

  /* Accepts CSS color names, #hex (with or without '#'), rgb()/hsl() etc.
     Returns a usable CSS color string, or null when unrecognized. */
  function resolveColor(raw) {
    const v = (raw || '').trim();
    if (!v) return null;
    const test = /^[0-9a-f]{3}(?:[0-9a-f]|(?:[0-9a-f]{2}){1,2})?$/i.test(v) ? '#' + v : v;
    const probe = document.createElement('i');
    probe.style.color = '';
    probe.style.color = test;
    return probe.style.color ? test : null;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text; /* user text is never raw HTML */
    return node;
  }

  function svgIcon(markup) {
    const wrap = document.createElement('span');
    wrap.innerHTML = markup; /* static developer-owned markup only */
    return wrap.firstElementChild;
  }

  const TRASH_SVG =
    '<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M2.5 4.2h11"/><path d="M6.3 2.3h3.4"/>' +
    '<path d="M3.9 4.2l.6 9a1.1 1.1 0 0 0 1.1 1h4.8a1.1 1.1 0 0 0 1.1-1l.6-9"/>' +
    '<path d="M6.6 7v4.4M9.4 7v4.4"/></svg>';

  /* ---------- rendering ---------- */

  function render() {
    renderSummary();
    renderList();
  }

  function renderSummary() {
    const counts = { fresh: 0, fading: 0, dead: 0 };
    for (const m of markers) counts[m.condition]++;
    summaryEl.replaceChildren();
    for (const key of ORDER) {
      const pill = el('span', 'pill');
      pill.append(
        el('span', 'dot dot-' + key),
        el('b', null, String(counts[key])),
        document.createTextNode(' ' + CONDITIONS[key].label.toLowerCase())
      );
      summaryEl.appendChild(pill);
    }
  }

  function renderList() {
    listEl.replaceChildren();
    for (const m of markers) listEl.appendChild(buildRow(m));
    const isEmpty = markers.length === 0;
    listEl.hidden = isEmpty;
    emptyEl.hidden = !isEmpty;
  }

  function buildRow(m) {
    const li = el('li', 'row' + (m.condition === 'dead' ? ' is-dead' : ''));
    li.dataset.id = m.id;

    const cssColor = resolveColor(m.color);

    const cap = el('span', 'cap');
    cap.style.background = cssColor || 'var(--unknown)';
    if (!cssColor) cap.style.boxShadow = 'inset 0 0 0 1.5px var(--line-strong)';

    const main = el('div', 'main');
    const topline = el('div', 'topline');
    const nameDot = el('span', 'dot');
    nameDot.style.background = cssColor || 'var(--unknown)';
    if (!cssColor) nameDot.style.boxShadow = 'inset 0 0 0 1.5px var(--line-strong)';
    topline.append(nameDot, el('strong', 'name', m.color));
    main.appendChild(topline);
    if (m.note) main.appendChild(el('p', 'note', m.note));

    const def = CONDITIONS[m.condition];
    const chip = el('button', 'chip chip-' + m.condition);
    chip.type = 'button';
    chip.dataset.action = 'cycle';
    chip.title = 'Tap to change condition';
    chip.setAttribute('aria-label',
      m.color + ': currently ' + def.label + '. Activate to change condition.');
    chip.append(el('span', 'chip-sym', def.sym), el('span', null, def.label));

    const del = el('button', 'del');
    del.type = 'button';
    del.dataset.action = 'delete';
    del.setAttribute('aria-label', 'Delete ' + m.color + ' marker');
    del.appendChild(svgIcon(TRASH_SVG));

    li.append(cap, main, chip, del);
    return li;
  }

  /* ---------- list actions (event delegation) ---------- */

  listEl.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    const id = row.dataset.id;
    const marker = markers.find((m) => m.id === id);
    if (!marker) return;

    if (e.target.closest('[data-action="delete"]')) {
      markers = markers.filter((m) => m.id !== id);
      save();
      render();
      return;
    }

    if (e.target.closest('[data-action="cycle"]')) {
      const next = ORDER[(ORDER.indexOf(marker.condition) + 1) % ORDER.length];
      marker.condition = next;
      save();
      render(); /* full re-render keeps summary + row state in sync */
    }
  });

  /* ---------- add form ---------- */

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const color = colorIn.value.trim();
    if (!color) {           /* required attr covers this, belt-and-suspenders */
      colorIn.focus();
      return;
    }
    markers.unshift({
      id: uid(),
      color: color.slice(0, 32),
      condition: selectedCondition,
      note: noteIn.value.trim().slice(0, 90)
    });
    save();
    render();

    form.reset();
    clearSwatchSelection();
    setCondition('fresh');
    colorIn.focus();
  });

  /* quick-pick swatches */
  for (const s of QUICK_SWATCHES) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'swatch';
    btn.dataset.name = s.name;
    btn.style.background = s.css;
    btn.setAttribute('aria-label', 'Use color ' + s.name);
    btn.addEventListener('click', () => {
      colorIn.value = s.name;
      clearSwatchSelection();
      btn.classList.add('active');
      colorIn.focus();
    });
    swatchRow.appendChild(btn);
  }

  colorIn.addEventListener('input', clearSwatchSelection);

  function clearSwatchSelection() {
    swatchRow.querySelectorAll('.swatch.active')
      .forEach((b) => b.classList.remove('active'));
  }

  /* segmented condition control */
  const segBtns = Array.from(document.querySelectorAll('.seg-btn'));
  segBtns.forEach((btn) => {
    btn.addEventListener('click', () => setCondition(btn.dataset.cond));
  });

  function setCondition(cond) {
    selectedCondition = cond;
    segBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cond === cond)));
  }

  /* empty-state actions */
  $('#focus-add').addEventListener('click', () => colorIn.focus());
  $('#load-sample').addEventListener('click', () => {
    markers = [
      { id: uid(), color: 'red',   condition: 'fresh',  note: 'the good one' },
      { id: uid(), color: 'blue',  condition: 'fresh',  note: '' },
      { id: uid(), color: 'black', condition: 'fading', note: 'getting pale on dark boards' },
      { id: uid(), color: 'green', condition: 'dead',   note: 'cap missing, smells weird' }
    ];
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
